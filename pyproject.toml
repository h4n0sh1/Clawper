[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clawper"
version = "0.1.0"
description = "Autonomous & Unattended CTF Wrapper for Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Clawper Team"}
]
keywords = ["ctf", "claude-code", "autonomous-agent", "hackthebox", "pentest", "security"]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
]

[project.scripts]
clawper = "clawper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clawper*"]
